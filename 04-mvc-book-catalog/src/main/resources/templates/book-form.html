<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Book</title>
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>

    <h1 th:if="${book.id==null}">New Book</h1>
    <h1 th:if="${book.id!=null}">Edit Book</h1>

    <form th:action="${book.id==null} ? @{/books} : @{/books/{id}(id=${book.id}) }"
      th:object="${book}" method="post">
      
      <div>
        <label for="title">Title:</label>
        <input type="text" name="title" id="title" th:field="*{title}">
      </div>

      <div>
        <label for="author">Autor:</label>
        <input type="text" name="author" id="author" th:field="*{author}">
      </div>

      <div>
        <label for="price">Price:</label>
        <input type="number" step="0.01" name="price" id="price" th:field="*{price}">
      </div>

      <button type="submit">Save</button>
    </form>
  
  </body>
</html>
